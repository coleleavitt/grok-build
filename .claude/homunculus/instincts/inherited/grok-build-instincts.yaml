# Grok Build Workflow Add Or Update Tool Implementation

## Action

Follow the add-or-update-tool-implementation workflow:
1. Create or update files in crates/codegen/xai-grok-tools/src/implementations/grok_build/<tool_name>/
2. Update corresponding mod.rs or tool.rs files to register or export the tool
3. Optionally update types in crates/codegen/xai-grok-tools/src/types/ or registry/types.rs
4. Add or update tests for the tool
5. Update documentation if needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~5x per month
