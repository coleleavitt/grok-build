name: ci

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Honors rust-toolchain.toml (stable 1.92.0 + rustfmt/clippy).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      # Caches ~/.cargo and target/ so runs after the first are fast.
      - uses: Swatinem/rust-cache@v2

      # The proto crates need protoc. This repo vendors it via dotslash, which
      # isn't present on CI runners, so install protoc directly and point the
      # build scripts at it through the PROTOC env var (build.rs checks it first).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export PROTOC path
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace
